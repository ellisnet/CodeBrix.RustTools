[package]
name = "test_project_09"
version = "0.1.0"
edition = "2024"
description = "Small axum JSON server on 127.0.0.1 that shuts itself down after a timeout"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
