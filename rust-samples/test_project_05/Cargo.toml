[package]
name = "test_project_05"
version = "0.1.0"
edition = "2024"
description = "Library + binary package with examples, integration tests and feature flags"
publish = false

# Explicit targets (Cargo would auto-discover these; they are spelled out for clarity).
[lib]
name = "textkit"
path = "src/lib.rs"

[[bin]]
name = "textkit"
path = "src/main.rs"

[features]
default = ["case"]
# Identifier case conversion (snake_case, kebab-case, CamelCase). On by default.
case = []
# JSON report of text statistics; pulls in optional dependencies.
json = ["dep:serde", "dep:serde_json"]

[dependencies]
# Local path dependencies under vendor/ - license-checker fixtures (see README.md).
licensed_by_file = { path = "vendor/licensed_by_file" }
unknown_license_id = { path = "vendor/unknown_license_id" }
no_license_at_all = { path = "vendor/no_license_at_all" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[[example]]
name = "json_report"
required-features = ["json"]
