[package]
name = "codebrix-api-extractor"
version = "1.0.0"
edition = "2024"
description = "Reads the public API of a Rust crate with syn and writes it as one JSON document (part of CodeBrix.RustTools.CrateBuilder)"
license = "MIT"
publish = false

# An empty workspace table keeps the tool a workspace of its own wherever it is materialised.
[workspace]

[[bin]]
name = "codebrix-api-extractor"
path = "src/main.rs"

[dependencies]
syn = { version = "2", default-features = false, features = ["full", "extra-traits", "visit", "parsing", "printing", "clone-impls", "derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
